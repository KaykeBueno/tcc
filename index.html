<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Define que vamos usar caracteres UTF-8 (assim podemos usar acentos e caracteres especiais) -->
    <meta charset="UTF-8">

    <!-- Faz a página se adaptar bem em dispositivos móveis (como celulares) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Carrega o Petite Vue (uma versão simples do Vue.js, para facilitar a interatividade) -->
    <script src="https://unpkg.com/petite-vue" defer></script>

    <!-- Carrega o script local 'login.js' (onde provavelmente está a lógica para fazer o login) -->
    <script src="View/js/login.js" defer></script>

    <!-- Título da página (que aparece na aba do navegador) -->
    <title>IGYM - Login</title>

    <!-- Carrega o arquivo de estilo CSS para deixar a página com a aparência definida -->
    <link rel="stylesheet" href="View/style.css">
</head>

<body class="page-login">
    <!-- Container principal que segura todo o conteúdo da página de login -->
    <div class="login-container">

        <!-- Container para a imagem (provavelmente o logo do IGYM) -->
        <div class="image-container">
            <!-- Imagem do logo, com um texto alternativo para acessibilidade -->
            <img src="imagens/png halter.png" alt="peso IGYM">
        </div>

        <!-- Container do formulário de login, usando o Petite Vue para controlar o estado (como o tipo de usuário) -->
        <div class="form-container" v-scope="FormApp">

            <!-- Título do login (aparece no topo) -->
            <h1 class="titulo">IGym</h1>

            <!-- Formulário onde o usuário vai digitar as informações para fazer login -->
            <form @submit.prevent="autenticar">

                <!-- Campo para escolher se o usuário vai logar com CPF ou CNPJ -->
                <div class="input-group">
                    <!-- Rótulo para o campo de seleção de tipo de usuário -->
                    <label for="tipoPessoa">Selecione seu tipo de usuario:</label>

                    <!-- Menu para o usuário escolher se vai usar CPF ou CNPJ -->
                    <select id="tipoPessoa" v-model="formData.tipoUsuario">
                        <option value="">Selecione</option>
                        <option value="cpf">CPF</option>
                        <option value="cnpj">CNPJ</option>
                    </select>
                </div>

                <!-- Se o tipo de usuário for CPF, aparece o campo para digitar o CPF -->
                <div id="cpfInputDiv" class="input-group" v-if="formData.tipoUsuario == 'cpf'">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" v-model="formData.cpf" placeholder="Digite seu CPF">
                </div>

                <!-- Se o tipo de usuário for CNPJ, aparece o campo para digitar o CNPJ -->
                <div id="cnpjInputDiv" class="input-group" v-if="formData.tipoUsuario == 'cnpj'">
                    <label for="cnpj">CNPJ:</label>
                    <input type="text" id="cnpj" v-model="formData.cnpj" placeholder="Digite seu CNPJ">
                </div>

                <!-- Campo para digitar a senha do usuário -->
                <div class="input-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" v-model="formData.senha" placeholder="Digite sua senha" required>
                </div>

                <!-- Botão de "Entrar", que vai submeter o formulário -->
                <button type="submit" class="login-button">Entrar</button>

                <!-- Links para cadastro de empresa ou usuário -->
                <p class="signup-link"><a href="View/cadastroEmpresa.html">Cadastro de empresa.</a></p>
                <p class="signup-link"><a href="View/cadastroUsuario.html">Cadastro de usuario.</a></p>
            </form>
        </div>
    </div>
</body>

</html>
