<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://unpkg.com/petite-vue" defer></script>

    <script src="js/cadastroEmpresa.js" defer></script>

    <title>IGYM - Cadastro de Empresa</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="page-login">

    <div class="cadastro-container">

        <div class="form-containerCadastro">

            <h1 class="titulo">Cadastre sua Empresa no IGYM</h1>

            <form @submit.prevent="cadastrarEmpresa" v-scope="formCadastroEmpresa">

                <div class="input-group">
                    <label for="nomeFantasia">Nome Fantasia:</label>
                    <input type="text" id="nomeFantasia" v-model="formData.nomeFantasia"
                        placeholder="Nome comercial da empresa" required>
                </div>

                <div class="input-group">
                    <label for="cnpj">CNPJ:</label>
                    <input type="text" id="cnpj" v-model="formData.cnpj" placeholder="00.000.000/0000-00" required>
                </div>

                <div class="input-group">
                    <label for="atividadeEconomica">Atividade Econômica:</label>
                    <input type="text" id="atividadeEconomica" v-model="formData.atividadeEconomica"
                        placeholder="Ex: Academia de ginástica" required>
                </div>

                <div class="input-group">
                    <label for="telefone">Telefone:</label>
                    <input type="text" id="telefone" v-model="formData.telefone" placeholder="(XX) XXXXX-XXXX" required>
                </div>

                <div class="input-group">
                    <label for="porteEmpresarial">Porte Empresarial:</label>
                    <select id="porteEmpresarial" v-model="formData.porteEmpresarial" required>
                        <option value="">Selecione o porte</option>
                        <option value="MEI">Microempresa Individual (MEI)</option>
                        <option value="ME">Microempresa (ME)</option>
                        <option value="EPP">Empresa de Pequeno Porte (EPP)</option>
                        <option value="EMP">Empresa de Médio Porte (EMP)</option>
                        <option value="GE">Grande Empresa</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="emailEmpresa">Email:</label>
                    <input type="text" id="emailEmpresa" v-model="formData.email" placeholder="contato@suaempresa.com"
                        required>
                </div>

                <div class="input-group">
                    <label for="senhaEmpresa">Senha:</label>
                    <input type="password" id="senhaEmpresa" v-model="formData.senha" placeholder="Sua senha" required>
                </div>

                <div class="input-group">
                    <label for="confirmarSenhaEmpresa">Confirmar Senha:</label>
                    <input type="password" id="confirmarSenhaEmpresa" v-model="formData.confirmarSenha"
                        placeholder="Confirme sua senha" required>
                </div>

                <button type="submit" class="login-button">Cadastrar Empresa</button>

                <p class="signup-link"><a href="login.html">Tela de login</a></p>
            </form>
        </div>
    </div>
</body>

</html>
