<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://unpkg.com/petite-vue" defer init></script>

    <script src="/tcc/View/js/cadastroPortifolio.js" defer></script>

    <title>IGYM - Cadastro de Portfólio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="page-login">

    <div class="cadastro-container">

        <div class="form-containerCadastro">

            <h1 class="titulo">Cadastrar Portfólio</h1>

            <form @submit.prevent="cadastrarPortifolio" v-scope="formCadastroPortifolio">

                <div class="input-group">
                    <label for="treinoSelect">Selecione o Treino para vincular ao Portfólio:</label>
                    <select id="treinoSelect" v-model="formData.treino_idTreino" required>
                        <option value="">Carregando treinos...</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="descricao">Descrição:</label>
                    <input type="text" id="descricao" v-model="formData.descricao" placeholder="Descrição do portfólio" required>
                </div>

                <div class="input-group">
                    <label for="metodologia">Metodologia :</label>
                    <input type="text" id="metodologia" v-model="formData.metodologia" placeholder="Ex: Treino funcional, hipertrofia..." required>
                </div>

                <div class="input-group">
                    <label for="dificuldade">Dificuldade:</label>
                    <select id="dificuldade" v-model="formData.dificuldade" required>
                        <option value="">-- selecione --</option>
                        <option value="Iniciante">Iniciante</option>
                        <option value="Intermediario">Intermediario</option>
                        <option value="Avançado">Avançado</option>
                    </select>
                </div>

                <button type="submit" class="login-button">Cadastrar Portfólio</button>

                <p class="signup-link"><a href="perfilEmpresa.php">Voltar ao perfil</a></p>
            </form>
        </div>
    </div>
</body>

</html>
